# ============================================================
# MCP-RAG-Hub —— 一条命令拉起
#
# 用法（Windows PowerShell，在项目根执行）：
#
#   # ① 指向宿主已缓存的 HuggingFace 模型（必需，否则容器会尝试联网下载并卡住）
#   $env:HF_CACHE = "$env:USERPROFILE\.cache\huggingface"
#
#   # ② 起 Ollama（另开一个窗口，保持不关）
#   & "D:\1software\ollama\ollama-windows-amd64\ollama.exe" serve
#
#   # ③ 构建并启动
#   docker compose up --build
#   # 浏览器打开 http://localhost:8501
#
#   # 换语料（不用改文件）
#   $env:MCP_RAG_CORPUS = "vue-zh"; docker compose up
#
# 停止：docker compose down
# ============================================================

services:
  rag-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-rag-hub:local
    container_name: mcp-rag-hub

    ports:
      - "8501:8501"

    environment:
      # 语料选择：fastapi-zh（默认）/ vue-zh。两份语料都已烧进镜像。
      MCP_RAG_CORPUS: ${MCP_RAG_CORPUS:-fastapi-zh}
      # Ollama 在宿主上跑，不在容器里。ollama SDK 和评测脚本都读这个变量。
      # （2026-09-15 清单 C7：此前评测脚本硬编码 127.0.0.1:11434，容器内跑评测连不上宿主；
      #   现已统一为运行时读 OLLAMA_HOST，评测也能在容器里跑了。）
      OLLAMA_HOST: http://host.docker.internal:11434
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONIOENCODING: "utf-8"

    # 让容器内的 host.docker.internal 指向宿主（Windows/macOS 的 Docker Desktop
    # 本来就支持，这行是为了在 Linux 上也能跑）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 向量索引：持久化到宿主，重建容器不用重新索引（首次启动会自动建）
      - ./chroma_db:/app/chroma_db
      # 评测产物：跑完直接在本机 experiments/ 里看
      - ./experiments:/app/experiments
      # 验收集与 KG 缓存
      - ./data:/app/data
      # 模型缓存：挂载宿主已缓存的 HuggingFace 目录。
      # 用长语法（type/source/target）而不是短语法，因为短语法会先按冒号切分整串，
      # 提示语里只要出现冒号就会被切坏并报 "missing a mount target"（本文件踩过）。
      # `:?` 让变量没设时直接报错退出 —— 否则会静默挂个空目录，
      # 后果是容器以为没有模型、开始联网下载，在墙内卡死且极难排查。
      - type: bind
        source: ${HF_CACHE:?HF_CACHE is required, point it to your HuggingFace cache dir}
        target: /root/.cache/huggingface

    restart: unless-stopped
    # 健康检查沿用 Dockerfile 里的 HEALTHCHECK（stcore/_stcore/health）
